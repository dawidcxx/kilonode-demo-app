name: kilonode-demo-app
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kilonode-demo-app
      POSTGRES_PASSWORD: kilonode-demo-app
      POSTGRES_DB: kilonode-demo-app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kilonode-demo-app -d kilonode-demo-app"]
      interval: 2s
      timeout: 5s
      retries: 5
    ports:
      - "6661:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: flat
    ports:
      - "6664:8080"
    depends_on:
      - db

  app:
    image: kilonode-demo-app:local
    profiles:
      - full
    environment:
      DATABASE_URL: postgresql://kilonode-demo-app:kilonode-demo-app@db:5432/kilonode-demo-app
      PORT: 8080
      HOST: 0.0.0.0
    ports:
      - "6663:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: